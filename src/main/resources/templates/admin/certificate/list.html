<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Certificate Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Certificate Management

        </h2>

        <a th:href="@{/admin/certificates/add}"
           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            Add Certificate

        </a>

    </div>

    <!-- Search -->

    <form method="get"
          th:action="@{/admin/certificates/search}"
          class="row mb-4">

        <div class="col-md-10">

            <input type="text"
                   name="keyword"
                   class="form-control"
                   placeholder="Search Certificate">

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">

                <i class="bi bi-search"></i>

                Search

            </button>

        </div>

    </form>

    <!-- Alerts -->

    <div class="alert alert-success"
         th:if="${param.success}">

        Certificate added successfully.

    </div>

    <div class="alert alert-primary"
         th:if="${param.updated}">

        Certificate updated successfully.

    </div>

    <div class="alert alert-danger"
         th:if="${param.deleted}">

        Certificate deleted successfully.

    </div>

    <!-- Table -->

    <div class="table-responsive">

        <table class="table table-hover table-dark align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Image</th>

                <th>Certificate</th>

                <th>Organization</th>

                <th>Issue Date</th>

                <th>Featured</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="certificate : ${certificates}">

                <td th:text="${certificate.id}"></td>

                <td>

                    <img th:src="@{'/uploads/' + ${certificate.image}}"
                         width="90"
                         class="rounded shadow">

                </td>

                <td>

                    <strong th:text="${certificate.title}"></strong>

                </td>

                <td th:text="${certificate.organization}"></td>

                <td th:text="${certificate.issueDate}"></td>

                <td>

                    <span class="badge bg-primary"
                          th:if="${certificate.featured}">

                        Featured

                    </span>

                    <span class="badge bg-secondary"
                          th:unless="${certificate.featured}">

                        No

                    </span>

                </td>

                <td>

                    <span class="badge bg-success"
                          th:if="${certificate.active}">

                        Active

                    </span>

                    <span class="badge bg-danger"
                          th:unless="${certificate.active}">

                        Inactive

                    </span>

                </td>

                <td>

                    <a th:href="@{'/admin/certificates/view/' + ${certificate.id}}"
                       class="btn btn-info btn-sm">

                        <i class="bi bi-eye-fill"></i>

                    </a>

                    <a th:href="@{'/admin/certificates/edit/' + ${certificate.id}}"
                       class="btn btn-warning btn-sm">

                        <i class="bi bi-pencil-square"></i>

                    </a>

                    <a th:href="@{'/admin/certificates/delete/' + ${certificate.id}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this certificate?')">

                        <i class="bi bi-trash-fill"></i>

                    </a>

                    <a th:if="${certificate.active}"
                       th:href="@{'/admin/certificates/deactivate/' + ${certificate.id}}"
                       class="btn btn-secondary btn-sm">

                        Deactivate

                    </a>

                    <a th:unless="${certificate.active}"
                       th:href="@{'/admin/certificates/activate/' + ${certificate.id}}"
                       class="btn btn-success btn-sm">

                        Activate

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- Pagination -->

    <nav class="mt-4">

        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:each="page : ${#numbers.sequence(1,totalPages)}">

                <a class="page-link"
                   th:text="${page}"
                   th:href="@{'/admin/certificates/page/' + ${page}}">

                </a>

            </li>

        </ul>

    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
