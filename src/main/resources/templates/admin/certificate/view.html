<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>View Certificate</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Certificate Details

        </h2>

        <div>

            <a th:href="@{/admin/certificates}"

               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back

            </a>

            <button class="btn btn-primary"

                    onclick="window.print()">

                <i class="bi bi-printer-fill"></i>

                Print

            </button>

        </div>

    </div>

    <div class="card shadow-lg">

        <div class="card-body">

            <div class="row">

                <div class="col-lg-5 text-center">

                    <img th:src="@{'/uploads/' + ${certificate.image}}"

                         class="img-fluid rounded shadow"

                         alt="Certificate">

                </div>

                <div class="col-lg-7">

                    <h2 th:text="${certificate.title}"></h2>

                    <hr>

                    <table class="table table-bordered">

                        <tr>

                            <th width="220">

                                Certificate Name

                            </th>

                            <td th:text="${certificate.title}"></td>

                        </tr>

                        <tr>

                            <th>

                                Organization

                            </th>

                            <td th:text="${certificate.organization}"></td>

                        </tr>

                        <tr>

                            <th>

                                Issue Date

                            </th>

                            <td th:text="${certificate.issueDate}"></td>

                        </tr>

                        <tr>

                            <th>

                                Expiry Date

                            </th>

                            <td>

                                <span th:if="${certificate.expiryDate!=null}"

                                      th:text="${certificate.expiryDate}">

                                </span>

                                <span th:unless="${certificate.expiryDate!=null}">

                                    No Expiry

                                </span>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Credential ID

                            </th>

                            <td th:text="${certificate.credentialId}"></td>

                        </tr>

                        <tr>

                            <th>

                                Credential URL

                            </th>

                            <td>

                                <a th:href="${certificate.credentialUrl}"

                                   target="_blank">

                                    Open Credential

                                </a>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Status

                            </th>

                            <td>

                                <span class="badge bg-success"

                                      th:if="${certificate.active}">

                                    Active

                                </span>

                                <span class="badge bg-danger"

                                      th:unless="${certificate.active}">

                                    Inactive

                                </span>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Featured

                            </th>

                            <td>

                                <span class="badge bg-primary"

                                      th:if="${certificate.featured}">

                                    Featured

                                </span>

                                <span class="badge bg-secondary"

                                      th:unless="${certificate.featured}">

                                    No

                                </span>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Display Order

                            </th>

                            <td th:text="${certificate.displayOrder}"></td>

                        </tr>

                        <tr>

                            <th>

                                Created At

                            </th>

                            <td th:text="${certificate.createdAt}"></td>

                        </tr>

                        <tr>

                            <th>

                                Updated At

                            </th>

                            <td th:text="${certificate.updatedAt}"></td>

                        </tr>

                    </table>

                </div>

            </div>

            <hr>

            <h4>

                Description

            </h4>

            <div class="card">

                <div class="card-body">

                    <p style="white-space:pre-line"

                       th:text="${certificate.description}">

                    </p>

                </div>

            </div>

            <div class="text-end mt-4">

                <a th:href="@{'/admin/certificates/edit/' + ${certificate.id}}"

                   class="btn btn-warning">

                    <i class="bi bi-pencil-square"></i>

                    Edit Certificate

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
