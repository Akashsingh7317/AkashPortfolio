<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Certificate</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-award-fill"></i>

                Add Certificate

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/certificates/save}"
                  th:object="${certificate}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Certificate Title

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{title}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Organization

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{organization}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Issue Date

                        </label>

                        <input type="date"
                               class="form-control"
                               th:field="*{issueDate}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Expiry Date

                        </label>

                        <input type="date"
                               class="form-control"
                               th:field="*{expiryDate}">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Credential ID

                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{credentialId}">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Credential URL

                    </label>

                    <input type="url"
                           class="form-control"
                           placeholder="https://..."
                           th:field="*{credentialUrl}">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea rows="5"
                              class="form-control"
                              th:field="*{description}">
                    </textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Certificate Image

                    </label>

                    <input type="file"
                           class="form-control"
                           name="certificateImage"
                           accept="image/*">

                </div>

                <div class="row">

                    <div class="col-md-4">

                        <div class="form-check mt-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{active}">

                            <label class="form-check-label">

                                Active

                            </label>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="form-check mt-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{featured}">

                            <label class="form-check-label">

                                Featured

                            </label>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Display Order

                        </label>

                        <input type="number"
                               class="form-control"
                               value="1"
                               th:field="*{displayOrder}">

                    </div>

                </div>

                <hr>

                <div class="text-end">

                    <button type="reset"
                            class="btn btn-secondary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Certificate

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
