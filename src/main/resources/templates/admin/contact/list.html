<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Contact Messages</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Contact Messages

        </h2>

        <a th:href="@{/admin/dashboard}"

           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Dashboard

        </a>

    </div>

    <!-- Success Alerts -->

    <div class="alert alert-success"

         th:if="${param.deleted}">

        Message deleted successfully.

    </div>

    <div class="alert alert-primary"

         th:if="${param.read}">

        Message marked as read.

    </div>

    <!-- Search -->

    <form method="get"

          th:action="@{/admin/contact/search}"

          class="row mb-4">

        <div class="col-md-10">

            <input

                    type="text"

                    class="form-control"

                    name="keyword"

                    placeholder="Search by Name, Email or Subject">

        </div>

        <div class="col-md-2">

            <button

                    class="btn btn-success w-100">

                <i class="bi bi-search"></i>

                Search

            </button>

        </div>

    </form>

    <!-- Contact Table -->

    <div class="table-responsive">

        <table class="table table-hover table-dark align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Subject</th>

                <th>Date</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="contact : ${contacts}">

                <td th:text="${contact.id}"></td>

                <td>

                    <strong

                            th:text="${contact.name}">

                    </strong>

                </td>

                <td>

                    <a th:href="'mailto:' + ${contact.email}"

                       th:text="${contact.email}">

                    </a>

                </td>

                <td th:text="${contact.subject}"></td>

                <td th:text="${contact.createdAt}"></td>

                <td>

                    <span class="badge bg-danger"

                          th:if="${!contact.read}">

                        New

                    </span>

                    <span class="badge bg-success"

                          th:if="${contact.read}">

                        Read

                    </span>

                </td>

                <td>

                    <a th:href="@{'/admin/contact/view/' + ${contact.id}}"

                       class="btn btn-info btn-sm">

                        <i class="bi bi-eye-fill"></i>

                    </a>

                    <a th:if="${!contact.read}"

                       th:href="@{'/admin/contact/read/' + ${contact.id}}"

                       class="btn btn-success btn-sm">

                        <i class="bi bi-check-circle"></i>

                    </a>

                    <a th:href="@{'/admin/contact/delete/' + ${contact.id}}"

                       class="btn btn-danger btn-sm"

                       onclick="return confirm('Delete this message?')">

                        <i class="bi bi-trash-fill"></i>

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- Pagination -->

    <nav class="mt-4">

        <ul class="pagination justify-content-center">

            <li class="page-item"

                th:each="page : ${#numbers.sequence(1,totalPages)}">

                <a class="page-link"

                   th:text="${page}"

                   th:href="@{'/admin/contact/page/' + ${page}}">

                </a>

            </li>

        </ul>

    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
