<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>View Contact Message</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Contact Message

        </h2>

        <div>

            <a th:href="@{/admin/contact}"

               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back

            </a>

            <a th:href="'mailto:' + ${contact.email}"

               class="btn btn-success">

                <i class="bi bi-envelope-fill"></i>

                Reply

            </a>

            <button class="btn btn-primary"

                    onclick="window.print()">

                <i class="bi bi-printer-fill"></i>

                Print

            </button>

        </div>

    </div>

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h4>

                Message Details

            </h4>

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>

                    <th width="220">

                        Name

                    </th>

                    <td th:text="${contact.name}"></td>

                </tr>

                <tr>

                    <th>

                        Email

                    </th>

                    <td>

                        <a th:href="'mailto:' + ${contact.email}"

                           th:text="${contact.email}">

                        </a>

                    </td>

                </tr>

                <tr>

                    <th>

                        Phone

                    </th>

                    <td>

                        <span th:text="${contact.phone}"></span>

                    </td>

                </tr>

                <tr>

                    <th>

                        Subject

                    </th>

                    <td th:text="${contact.subject}"></td>

                </tr>

                <tr>

                    <th>

                        Received At

                    </th>

                    <td th:text="${contact.createdAt}"></td>

                </tr>

                <tr>

                    <th>

                        Status

                    </th>

                    <td>

                        <span class="badge bg-success"

                              th:if="${contact.read}">

                            Read

                        </span>

                        <span class="badge bg-danger"

                              th:unless="${contact.read}">

                            New

                        </span>

                    </td>

                </tr>

                <tr>

                    <th>

                        IP Address

                    </th>

                    <td>

                        <span th:text="${contact.ipAddress} ?: 'Not Available'">

                        </span>

                    </td>

                </tr>

                <tr>

                    <th>

                        Browser

                    </th>

                    <td>

                        <span th:text="${contact.browser} ?: 'Not Available'">

                        </span>

                    </td>

                </tr>

            </table>

            <hr>

            <h5>

                Message

            </h5>

            <div class="card">

                <div class="card-body bg-light">

                    <p style="white-space:pre-line;"

                       th:text="${contact.message}">

                    </p>

                </div>

            </div>

            <hr>

            <div class="text-end">

                <a th:if="${!contact.read}"

                   th:href="@{'/admin/contact/read/' + ${contact.id}}"

                   class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>

                    Mark as Read

                </a>

                <a th:href="@{'/admin/contact/delete/' + ${contact.id}}"

                   class="btn btn-danger"

                   onclick="return confirm('Delete this message permanently?')">

                    <i class="bi bi-trash-fill"></i>

                    Delete

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
