<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Skill</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-warning text-dark">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Skill

            </h3>

        </div>

        <div class="card-body">

            <form

                    th:action="@{'/admin/skills/update/' + ${skill.id}}"

                    th:object="${skill}"

                    method="post">

                <!-- ======================= -->
                <!-- Skill Name -->
                <!-- ======================= -->

                <div class="mb-3">

                    <label>

                        Skill Name

                    </label>

                    <input

                            type="text"

                            class="form-control"

                            th:field="*{skillName}"

                            required>

                </div>

                <!-- ======================= -->
                <!-- Icon -->
                <!-- ======================= -->

                <div class="mb-3">

                    <label>

                        Icon Class

                    </label>

                    <input

                            id="iconInput"

                            type="text"

                            class="form-control"

                            th:field="*{icon}">

                    <small class="text-muted">

                        Example:
                        fab fa-java,
                        bi bi-code-slash,
                        fab fa-html5

                    </small>

                </div>

                <div class="text-center mb-4">

                    <i id="iconPreview"

                       th:class="${skill.icon}"

                       style="font-size:80px;color:#0d6efd;">

                    </i>

                </div>

                <!-- ======================= -->
                <!-- Category -->
                <!-- ======================= -->

                <div class="mb-3">

                    <label>

                        Category

                    </label>

                    <select

                            class="form-select"

                            th:field="*{category}">

                        <option value="Backend">Backend</option>

                        <option value="Frontend">Frontend</option>

                        <option value="Database">Database</option>

                        <option value="DevOps">DevOps</option>

                        <option value="Cloud">Cloud</option>

                        <option value="Tools">Tools</option>

                    </select>

                </div>

                <!-- ======================= -->
                <!-- Percentage -->
                <!-- ======================= -->

                <div class="mb-3">

                    <label>

                        Skill Percentage

                    </label>

                    <input

                            type="range"

                            min="0"

                            max="100"

                            id="percentageRange"

                            class="form-range"

                            th:field="*{percentage}">

                    <h4 id="percentageValue"

                        th:text="${skill.percentage + '%'}">

                    </h4>

                </div>
				                <!-- ======================= -->
				                <!-- Settings -->
				                <!-- ======================= -->

				                <div class="row">

				                    <div class="col-md-4">

				                        <div class="form-check mt-4">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{active}">

				                            <label class="form-check-label">

				                                Active Skill

				                            </label>

				                        </div>

				                    </div>

				                    <div class="col-md-4">

				                        <div class="form-check mt-4">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{featured}">

				                            <label class="form-check-label">

				                                Featured Skill

				                            </label>

				                        </div>

				                    </div>

				                    <div class="col-md-4">

				                        <label>

				                            Display Order

				                        </label>

				                        <input

				                                type="number"

				                                class="form-control"

				                                th:field="*{displayOrder}">

				                    </div>

				                </div>

				                <hr>

				                <!-- ======================= -->
				                <!-- Buttons -->
				                <!-- ======================= -->

				                <div class="text-end">

				                    <a

				                            th:href="@{/admin/skills}"

				                            class="btn btn-secondary">

				                        <i class="bi bi-arrow-left"></i>

				                        Cancel

				                    </a>

				                    <button

				                            type="submit"

				                            class="btn btn-success">

				                        <i class="bi bi-check-circle-fill"></i>

				                        Update Skill

				                    </button>

				                </div>

				            </form>

				        </div>

				    </div>

				</div>

				<!-- ======================= -->
				<!-- JavaScript -->
				<!-- ======================= -->

				<script>

				const percentageRange =
				document.getElementById("percentageRange");

				const percentageValue =
				document.getElementById("percentageValue");

				percentageValue.innerHTML =
				percentageRange.value + "%";

				percentageRange.oninput = function(){

				    percentageValue.innerHTML =
				    this.value + "%";

				};

				const iconInput =
				document.getElementById("iconInput");

				const iconPreview =
				document.getElementById("iconPreview");

				iconInput.addEventListener("keyup",function(){

				    iconPreview.className = this.value;

				    iconPreview.style.fontSize = "80px";

				    iconPreview.style.color = "#0d6efd";

				});

				</script>

				<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

				</body>

				</html>
