<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Skill Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Skill Management

        </h2>

        <a th:href="@{/admin/skills/add}"

           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            Add Skill

        </a>

    </div>

    <!-- Search -->

    <form th:action="@{/admin/skills/search}"

          method="get"

          class="row mb-4">

        <div class="col-md-10">

            <input

                    type="text"

                    class="form-control"

                    name="keyword"

                    placeholder="Search Skill">

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">

                <i class="bi bi-search"></i>

                Search

            </button>

        </div>

    </form>

    <!-- Skill Table -->

    <div class="table-responsive">

        <table class="table table-dark table-hover align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Icon</th>

                <th>Skill</th>

                <th>Category</th>

                <th>Percentage</th>

                <th>Status</th>

                <th>Featured</th>

                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="skill : ${skills}">

                <td th:text="${skill.id}"></td>

                <td>

                    <i th:class="${skill.icon}"

                       style="font-size:30px;"></i>

                </td>

                <td>

                    <strong

                            th:text="${skill.skillName}">

                    </strong>

                </td>

                <td

                        th:text="${skill.category}">

                </td>

                <td>

                    <div class="progress">

                        <div class="progress-bar"

                             th:style="'width:'+${skill.percentage}+'%'"

                             th:text="${skill.percentage+'%'}">

                        </div>

                    </div>

                </td>

                <td>

                    <span

                            class="badge bg-success"

                            th:if="${skill.active}">

                        Active

                    </span>

                    <span

                            class="badge bg-danger"

                            th:unless="${skill.active}">

                        Inactive

                    </span>

                </td>

                <td>

                    <span

                            class="badge bg-primary"

                            th:if="${skill.featured}">

                        Featured

                    </span>

                    <span

                            class="badge bg-secondary"

                            th:unless="${skill.featured}">

                        No

                    </span>

                </td>

                <td>
					
					                    <a th:href="@{'/admin/skills/view/' + ${skill.id}}"
					                       class="btn btn-sm btn-info">

					                        <i class="bi bi-eye-fill"></i>

					                    </a>

					                    <a th:href="@{'/admin/skills/edit/' + ${skill.id}}"
					                       class="btn btn-sm btn-warning">

					                        <i class="bi bi-pencil-square"></i>

					                    </a>

					                    <a th:href="@{'/admin/skills/delete/' + ${skill.id}}"
					                       class="btn btn-sm btn-danger"
					                       onclick="return confirm('Delete this skill?')">

					                        <i class="bi bi-trash-fill"></i>

					                    </a>

					                    <a th:if="${skill.active}"
					                       th:href="@{'/admin/skills/deactivate/' + ${skill.id}}"
					                       class="btn btn-sm btn-secondary">

					                        Deactivate

					                    </a>

					                    <a th:unless="${skill.active}"
					                       th:href="@{'/admin/skills/activate/' + ${skill.id}}"
					                       class="btn btn-sm btn-success">

					                        Activate

					                    </a>

					                    <a th:if="${skill.featured}"
					                       th:href="@{'/admin/skills/remove-feature/' + ${skill.id}}"
					                       class="btn btn-sm btn-dark">

					                        Remove Feature

					                    </a>

					                    <a th:unless="${skill.featured}"
					                       th:href="@{'/admin/skills/feature/' + ${skill.id}}"
					                       class="btn btn-sm btn-primary">

					                        Feature

					                    </a>

					                </td>

					            </tr>

					            </tbody>

					        </table>

					    </div>

					    <!-- ========================= -->
					    <!-- Alerts -->
					    <!-- ========================= -->

					    <div th:if="${param.success}"
					         class="alert alert-success mt-3">

					        Skill saved successfully.

					    </div>

					    <div th:if="${param.updated}"
					         class="alert alert-primary mt-3">

					        Skill updated successfully.

					    </div>

					    <div th:if="${param.deleted}"
					         class="alert alert-danger mt-3">

					        Skill deleted successfully.

					    </div>

					    <!-- ========================= -->
					    <!-- Pagination -->
					    <!-- ========================= -->

					    <nav class="mt-4">

					        <ul class="pagination justify-content-center">

					            <li class="page-item"
					                th:each="i : ${#numbers.sequence(1,totalPages)}">

					                <a class="page-link"
					                   th:text="${i}"
					                   th:href="@{'/admin/skills/page/' + ${i}}">

					                </a>

					            </li>

					        </ul>

					    </nav>

					</div>

					<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

					</body>

					</html>
