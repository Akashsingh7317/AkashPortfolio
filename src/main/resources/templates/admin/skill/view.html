<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>View Skill</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Skill Details

        </h2>

        <div>

            <a th:href="@{/admin/skills}"

               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back

            </a>

            <button

                    onclick="window.print()"

                    class="btn btn-primary">

                <i class="bi bi-printer-fill"></i>

                Print

            </button>

        </div>

    </div>

    <div class="card shadow-lg">

        <div class="card-body">

            <div class="row">

                <!-- ======================= -->

                <!-- Skill Icon -->

                <!-- ======================= -->

                <div class="col-lg-4 text-center">

                    <i

                       th:class="${skill.icon}"

                       style="font-size:120px;color:#0d6efd;">

                    </i>

                </div>

                <!-- ======================= -->

                <!-- Skill Information -->

                <!-- ======================= -->

                <div class="col-lg-8">

                    <table class="table table-bordered">

                        <tr>

                            <th width="220">

                                Skill Name

                            </th>

                            <td

                                    th:text="${skill.skillName}">

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Category

                            </th>

                            <td

                                    th:text="${skill.category}">

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Percentage

                            </th>

                            <td>

                                <div class="progress">

                                    <div class="progress-bar"

                                         th:style="'width:'+${skill.percentage}+'%'"

                                         th:text="${skill.percentage+'%'}">

                                    </div>

                                </div>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Status

                            </th>

                            <td>

                                <span

                                        class="badge bg-success"

                                        th:if="${skill.active}">

                                    Active

                                </span>

                                <span

                                        class="badge bg-danger"

                                        th:unless="${skill.active}">

                                    Inactive

                                </span>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Featured

                            </th>

                            <td>

                                <span

                                        class="badge bg-primary"

                                        th:if="${skill.featured}">

                                    Yes

                                </span>

                                <span

                                        class="badge bg-secondary"

                                        th:unless="${skill.featured}">

                                    No

                                </span>

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Display Order

                            </th>

                            <td

                                    th:text="${skill.displayOrder}">

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Created Date

                            </th>

                            <td

                                    th:text="${skill.createdAt}">

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Updated Date

                            </th>

                            <td

                                    th:text="${skill.updatedAt}">

                            </td>

                        </tr>

                    </table>

                </div>

            </div>

            <div class="text-end mt-4">

                <a

                   th:href="@{'/admin/skills/edit/' + ${skill.id}}"

                   class="btn btn-warning">

                    <i class="bi bi-pencil-square"></i>

                    Edit Skill

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
