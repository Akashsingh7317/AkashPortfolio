<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Skill</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-plus-circle"></i>

                Add New Skill

            </h3>

        </div>

        <div class="card-body">

            <form

                    th:action="@{/admin/skills/save}"

                    th:object="${skill}"

                    method="post">

                <!-- ===================== -->

                <!-- Skill Name -->

                <!-- ===================== -->

                <div class="mb-3">

                    <label>

                        Skill Name

                    </label>

                    <input

                            type="text"

                            class="form-control"

                            th:field="*{skillName}"

                            placeholder="Java"

                            required>

                </div>

                <!-- ===================== -->

                <!-- Skill Icon -->

                <!-- ===================== -->

                <div class="mb-3">

                    <label>

                        Icon Class

                    </label>

                    <input

                            type="text"

                            class="form-control"

                            th:field="*{icon}"

                            placeholder="fab fa-java">

                    <small class="text-muted">

                        Example :
                        fab fa-java,
                        bi bi-code-slash,
                        fab fa-html5

                    </small>

                </div>

                <!-- ===================== -->

                <!-- Category -->

                <!-- ===================== -->

                <div class="mb-3">

                    <label>

                        Category

                    </label>

                    <select

                            class="form-select"

                            th:field="*{category}">

                        <option>

                            Backend

                        </option>

                        <option>

                            Frontend

                        </option>

                        <option>

                            Database

                        </option>

                        <option>

                            DevOps

                        </option>

                        <option>

                            Cloud

                        </option>

                        <option>

                            Tools

                        </option>

                    </select>

                </div>

                <!-- ===================== -->

                <!-- Percentage -->

                <!-- ===================== -->

                <div class="mb-3">

                    <label>

                        Skill Percentage

                    </label>

                    <input

                            type="range"

                            min="0"

                            max="100"

                            value="80"

                            class="form-range"

                            id="percentageRange"

                            th:field="*{percentage}">

                    <h4 id="percentageValue">

                        80%

                    </h4>

                </div>
				                <!-- ===================== -->
				                <!-- Settings -->
				                <!-- ===================== -->

				                <div class="row">

				                    <div class="col-md-4">

				                        <div class="form-check mt-3">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{active}">

				                            <label class="form-check-label">

				                                Active Skill

				                            </label>

				                        </div>

				                    </div>

				                    <div class="col-md-4">

				                        <div class="form-check mt-3">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{featured}">

				                            <label class="form-check-label">

				                                Featured Skill

				                            </label>

				                        </div>

				                    </div>

				                    <div class="col-md-4">

				                        <label>

				                            Display Order

				                        </label>

				                        <input

				                                type="number"

				                                class="form-control"

				                                value="1"

				                                th:field="*{displayOrder}">

				                    </div>

				                </div>

				                <hr>

				                <!-- ===================== -->
				                <!-- Icon Preview -->
				                <!-- ===================== -->

				                <div class="mb-4">

				                    <label>

				                        Live Icon Preview

				                    </label>

				                    <div class="text-center mt-3">

				                        <i id="iconPreview"

				                           class="fab fa-java"

				                           style="font-size:70px;color:#0d6efd;">

				                        </i>

				                    </div>

				                </div>

				                <!-- ===================== -->
				                <!-- Buttons -->
				                <!-- ===================== -->

				                <div class="text-end">

				                    <button

				                            type="reset"

				                            class="btn btn-secondary">

				                        <i class="bi bi-arrow-clockwise"></i>

				                        Reset

				                    </button>

				                    <button

				                            type="submit"

				                            class="btn btn-success">

				                        <i class="bi bi-check-circle-fill"></i>

				                        Save Skill

				                    </button>

				                </div>

				            </form>

				        </div>

				    </div>

				</div>

				<script>

				const range = document.getElementById("percentageRange");

				const value = document.getElementById("percentageValue");

				value.innerHTML = range.value + "%";

				range.oninput = function(){

				    value.innerHTML = this.value + "%";

				};

				const iconInput = document.querySelector("input[name='icon']");

				const preview = document.getElementById("iconPreview");

				iconInput.addEventListener("keyup",function(){

				    preview.className = this.value;

				    preview.style.fontSize = "70px";

				    preview.style.color = "#0d6efd";

				});

				</script>

				<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

				</body>

				</html>
