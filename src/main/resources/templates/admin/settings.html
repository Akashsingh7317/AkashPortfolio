<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Portfolio Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card shadow-lg">

        <div class="card-header bg-dark text-white">

            <h3>

                <i class="bi bi-gear-fill"></i>

                Portfolio Settings

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/settings/update}"

                  th:object="${settings}"

                  method="post">

                <h5 class="mb-3">

                    Website Information

                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Website Title</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{websiteTitle}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Website Subtitle</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{websiteSubtitle}">

                    </div>

                </div>

                <div class="mb-3">

                    <label>Footer Text</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{footerText}">

                </div>

                <div class="mb-4">

                    <label>Meta Description</label>

                    <textarea rows="4"
                              class="form-control"
                              th:field="*{metaDescription}">
                    </textarea>

                </div>

                <hr>

                <h5 class="mb-3">

                    Contact Information

                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Email</label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Phone</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{phone}">

                    </div>

                </div>

                <div class="mb-4">

                    <label>Address</label>

                    <textarea rows="3"
                              class="form-control"
                              th:field="*{address}">
                    </textarea>

                </div>

                <hr>

                <h5 class="mb-3">

                    Social Media

                </h5>

                <div class="mb-3">

                    <label>GitHub</label>

                    <input type="url"
                           class="form-control"
                           th:field="*{github}">

                </div>

                <div class="mb-3">

                    <label>LinkedIn</label>

                    <input type="url"
                           class="form-control"
                           th:field="*{linkedin}">

                </div>

                <div class="mb-3">

                    <label>Instagram</label>

                    <input type="url"
                           class="form-control"
                           th:field="*{instagram}">

                </div>

                <div class="mb-4">

                    <label>YouTube</label>

                    <input type="url"
                           class="form-control"
                           th:field="*{youtube}">

                </div>

                <hr>

                <h5 class="mb-3">

                    Portfolio Options

                </h5>

                <div class="form-check mb-2">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{showProjects}">

                    <label class="form-check-label">

                        Show Projects Section

                    </label>

                </div>

                <div class="form-check mb-2">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{showCertificates}">

                    <label class="form-check-label">

                        Show Certificates Section

                    </label>

                </div>

                <div class="form-check mb-2">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{showExperience}">

                    <label class="form-check-label">

                        Show Experience Section

                    </label>

                </div>

                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{showSkills}">

                    <label class="form-check-label">

                        Show Skills Section

                    </label>

                </div>

                <hr>

                <div class="text-end">

                    <button type="reset"
                            class="btn btn-secondary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Settings

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
