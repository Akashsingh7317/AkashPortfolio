<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Experience</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-plus-circle"></i>

                Add Experience

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/experience/save}"
                  th:object="${experience}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Company Name</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{companyName}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Designation</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{designation}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Location</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{location}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Employment Type</label>

                        <select class="form-select"
                                th:field="*{employmentType}">

                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Internship">Internship</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Contract">Contract</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Start Date</label>

                        <input type="date"
                               class="form-control"
                               th:field="*{startDate}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>End Date</label>

                        <input type="date"
                               class="form-control"
                               th:field="*{endDate}">

                    </div>

                </div>

                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{currentCompany}">

                    <label class="form-check-label">

                        Currently Working Here

                    </label>

                </div>

                <div class="mb-3">

                    <label>Technologies Used</label>

                    <input type="text"
                           class="form-control"
                           placeholder="Java, Spring Boot, MySQL, Docker..."
                           th:field="*{technologies}">

                </div>

                <div class="mb-3">

                    <label>Roles & Responsibilities</label>

                    <textarea rows="6"
                              class="form-control"
                              th:field="*{description}">
                    </textarea>

                </div>

                <div class="row">

                    <div class="col-md-4">

                        <div class="form-check mt-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{active}">

                            <label class="form-check-label">

                                Active

                            </label>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="form-check mt-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{featured}">

                            <label class="form-check-label">

                                Featured

                            </label>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <label>Display Order</label>

                        <input type="number"
                               class="form-control"
                               value="1"
                               th:field="*{displayOrder}">

                    </div>

                </div>

                <hr>

                <div class="text-end">

                    <button type="reset"
                            class="btn btn-secondary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                    <button type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Experience

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
