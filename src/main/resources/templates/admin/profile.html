<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Profile</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-person-circle"></i>

                Admin Profile

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/profile/update}"

                  method="post"

                  th:object="${profile}"

                  enctype="multipart/form-data">

                <div class="text-center mb-4">

                    <img th:src="@{'/uploads/' + ${profile.profileImage}}"

                         class="rounded-circle border shadow"

                         width="170"

                         height="170"

                         style="object-fit:cover;">

                </div>

                <div class="mb-4">

                    <label>

                        Change Profile Image

                    </label>

                    <input type="file"

                           name="profileImage"

                           class="form-control"

                           accept="image/*">

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>

                            Full Name

                        </label>

                        <input type="text"

                               class="form-control"

                               th:field="*{name}"

                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Email Address

                        </label>

                        <input type="email"

                               class="form-control"

                               th:field="*{email}"

                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>

                            Mobile Number

                        </label>

                        <input type="text"

                               class="form-control"

                               th:field="*{mobile}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Designation

                        </label>

                        <input type="text"

                               class="form-control"

                               th:field="*{designation}">

                    </div>

                </div>

                <div class="mb-3">

                    <label>

                        About Me

                    </label>

                    <textarea rows="5"

                              class="form-control"

                              th:field="*{about}">

                    </textarea>

                </div>

                <hr>

                <h4>

                    Social Links

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>GitHub</label>

                        <input type="url"

                               class="form-control"

                               th:field="*{github}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>LinkedIn</label>

                        <input type="url"

                               class="form-control"

                               th:field="*{linkedin}">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Portfolio Website</label>

                        <input type="url"

                               class="form-control"

                               th:field="*{website}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Twitter / X</label>

                        <input type="url"

                               class="form-control"

                               th:field="*{twitter}">

                    </div>

                </div>

                <hr>

                <h4>

                    Resume

                </h4>

                <div class="mb-4">

                    <label>

                        Upload Resume (PDF)

                    </label>

                    <input type="file"

                           class="form-control"

                           name="resumeFile"

                           accept=".pdf">

                </div>

                <div class="mb-4">

                    <a th:href="@{'/uploads/' + ${profile.resume}}"

                       class="btn btn-outline-primary"

                       target="_blank">

                        <i class="bi bi-file-earmark-pdf-fill"></i>

                        View Resume

                    </a>

                </div>

                <hr>

                <div class="text-end">

                    <button type="reset"

                            class="btn btn-secondary">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                    <button type="submit"

                            class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Profile

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
