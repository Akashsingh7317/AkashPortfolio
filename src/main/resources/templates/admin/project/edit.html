<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Project</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-warning text-dark">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Project

            </h3>

        </div>

        <div class="card-body">

            <form

                    th:action="@{'/admin/projects/update/' + ${project.id}}"

                    th:object="${project}"

                    method="post"

                    enctype="multipart/form-data">

                <!-- ====================== -->
                <!-- Basic Details -->
                <!-- ====================== -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>

                            Project Title

                        </label>

                        <input

                                type="text"

                                class="form-control"

                                th:field="*{title}"

                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Category

                        </label>

                        <select

                                class="form-select"

                                th:field="*{category}">

                            <option value="Java">Java</option>

                            <option value="Spring Boot">Spring Boot</option>

                            <option value="Full Stack">Full Stack</option>

                            <option value="Desktop">Desktop</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label>

                        Short Description

                    </label>

                    <textarea

                            rows="3"

                            class="form-control"

                            th:field="*{shortDescription}">

                    </textarea>

                </div>

                <div class="mb-3">

                    <label>

                        Complete Description

                    </label>

                    <textarea

                            rows="8"

                            class="form-control"

                            th:field="*{description}">

                    </textarea>

                </div>

                <!-- ====================== -->
                <!-- Technologies -->
                <!-- ====================== -->

                <div class="mb-3">

                    <label>

                        Technologies

                    </label>

                    <input

                            type="text"

                            class="form-control"

                            th:field="*{technologies}">

                </div>

                <!-- ====================== -->
                <!-- Links -->
                <!-- ====================== -->

                <div class="row">

                    <div class="col-md-6">

                        <label>

                            GitHub URL

                        </label>

                        <input

                                type="url"

                                class="form-control"

                                th:field="*{githubUrl}">

                    </div>

                    <div class="col-md-6">

                        <label>

                            Live Demo URL

                        </label>

                        <input

                                type="url"

                                class="form-control"

                                th:field="*{liveUrl}">

                    </div>

                </div>

                <br>

                <!-- Current Thumbnail -->

                <div class="mb-3">

                    <label>

                        Current Thumbnail

                    </label>

                    <br>

                    <img

                            th:src="@{'/uploads/' + ${project.thumbnail}}"

                            class="img-thumbnail"

                            width="250">

                </div>

                <!-- Replace Thumbnail -->

                <div class="mb-3">

                    <label>

                        Replace Thumbnail

                    </label>

                    <input

                            type="file"

                            class="form-control"

                            name="thumbnailFile"

                            accept="image/*">

                </div>
				
				                <!-- ====================== -->
				                <!-- Current Demo Video -->
				                <!-- ====================== -->

				                <div class="mb-3">

				                    <label>

				                        Current Demo Video

				                    </label>

				                    <br>

				                    <video width="350" controls>

				                        <source
				                                th:src="@{'/uploads/' + ${project.demoVideo}}"
				                                type="video/mp4">

				                    </video>

				                </div>

				                <!-- Replace Demo Video -->

				                <div class="mb-3">

				                    <label>

				                        Replace Demo Video

				                    </label>

				                    <input

				                            type="file"

				                            class="form-control"

				                            name="demoVideoFile"

				                            accept="video/*">

				                </div>

				                <!-- ====================== -->
				                <!-- Gallery Images -->
				                <!-- ====================== -->

				                <div class="mb-3">

				                    <label>

				                        Current Gallery

				                    </label>

				                    <div class="row mt-3">

				                        <div class="col-md-3 mb-3"
				                             th:if="${project.image1 != null}">

				                            <img th:src="@{'/uploads/' + ${project.image1}}"

				                                 class="img-fluid rounded shadow">

				                        </div>

				                        <div class="col-md-3 mb-3"
				                             th:if="${project.image2 != null}">

				                            <img th:src="@{'/uploads/' + ${project.image2}}"

				                                 class="img-fluid rounded shadow">

				                        </div>

				                        <div class="col-md-3 mb-3"
				                             th:if="${project.image3 != null}">

				                            <img th:src="@{'/uploads/' + ${project.image3}}"

				                                 class="img-fluid rounded shadow">

				                        </div>

				                        <div class="col-md-3 mb-3"
				                             th:if="${project.image4 != null}">

				                            <img th:src="@{'/uploads/' + ${project.image4}}"

				                                 class="img-fluid rounded shadow">

				                        </div>

				                    </div>

				                </div>

				                <!-- Upload New Gallery -->

				                <div class="mb-3">

				                    <label>

				                        Upload New Gallery Images

				                    </label>

				                    <input

				                            type="file"

				                            class="form-control"

				                            name="galleryImages"

				                            multiple

				                            accept="image/*">

				                </div>

				                <!-- ====================== -->
				                <!-- SEO -->
				                <!-- ====================== -->

				                <div class="mb-3">

				                    <label>

				                        SEO Title

				                    </label>

				                    <input

				                            type="text"

				                            class="form-control"

				                            th:field="*{seoTitle}">

				                </div>

				                <div class="mb-3">

				                    <label>

				                        SEO Description

				                    </label>

				                    <textarea

				                            rows="4"

				                            class="form-control"

				                            th:field="*{seoDescription}">

				                    </textarea>

				                </div>

				                <!-- ====================== -->
				                <!-- Settings -->
				                <!-- ====================== -->

				                <div class="row">

				                    <div class="col-md-4">

				                        <label>

				                            Project Status

				                        </label>

				                        <select

				                                class="form-select"

				                                th:field="*{projectStatus}">

				                            <option value="Draft">

				                                Draft

				                            </option>

				                            <option value="Published">

				                                Published

				                            </option>

				                            <option value="Coming Soon">

				                                Coming Soon

				                            </option>

				                        </select>

				                    </div>

				                    <div class="col-md-4">

				                        <label>

				                            Display Order

				                        </label>

				                        <input

				                                type="number"

				                                class="form-control"

				                                th:field="*{displayOrder}">

				                    </div>

				                    <div class="col-md-4">

				                        <div class="form-check mt-4">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{featured}">

				                            <label class="form-check-label">

				                                Featured Project

				                            </label>

				                        </div>

				                    </div>

				                </div>

				                <div class="form-check mt-3">

				                    <input

				                            class="form-check-input"

				                            type="checkbox"

				                            th:field="*{published}">

				                    <label class="form-check-label">

				                        Published

				                    </label>

				                </div>

				                <!-- ====================== -->
				                <!-- Buttons -->
				                <!-- ====================== -->

				                <div class="text-end mt-4">

				                    <a th:href="@{/admin/projects}"

				                       class="btn btn-secondary">

				                        <i class="bi bi-arrow-left"></i>

				                        Cancel

				                    </a>

				                    <button

				                            type="submit"

				                            class="btn btn-success">

				                        <i class="bi bi-check-circle-fill"></i>

				                        Update Project

				                    </button>

				                </div>

				            </form>

				        </div>

				    </div>

				</div>

				<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

				</body>

				</html>
