<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Project</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-plus-circle"></i>

                Add New Project

            </h3>

        </div>

        <div class="card-body">

            <form

                    th:action="@{/admin/projects/save}"

                    method="post"

                    enctype="multipart/form-data"

                    th:object="${project}">

                <!-- ========================= -->

                <!-- Basic Details -->

                <!-- ========================= -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>

                            Project Title

                        </label>

                        <input

                                type="text"

                                class="form-control"

                                th:field="*{title}"

                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Category

                        </label>

                        <select

                                class="form-select"

                                th:field="*{category}">

                            <option value="Java">

                                Java

                            </option>

                            <option value="Spring Boot">

                                Spring Boot

                            </option>

                            <option value="Full Stack">

                                Full Stack

                            </option>

                            <option value="Desktop">

                                Desktop

                            </option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label>

                        Short Description

                    </label>

                    <textarea

                            rows="3"

                            class="form-control"

                            th:field="*{shortDescription}">

                    </textarea>

                </div>

                <div class="mb-3">

                    <label>

                        Complete Description

                    </label>

                    <textarea

                            rows="8"

                            class="form-control"

                            th:field="*{description}">

                    </textarea>

                </div>

                <!-- ========================= -->

                <!-- Technologies -->

                <!-- ========================= -->

                <div class="mb-3">

                    <label>

                        Technologies Used

                    </label>

                    <input

                            type="text"

                            class="form-control"

                            placeholder="Java, Spring Boot, MySQL..."

                            th:field="*{technologies}">

                </div>

                <!-- ========================= -->

                <!-- Links -->

                <!-- ========================= -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>

                            GitHub URL

                        </label>

                        <input

                                type="url"

                                class="form-control"

                                th:field="*{githubUrl}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Live Demo URL

                        </label>

                        <input

                                type="url"

                                class="form-control"

                                th:field="*{liveUrl}">

                    </div>

                </div>
				
				                <!-- ========================= -->
				                <!-- Upload Section -->
				                <!-- ========================= -->

				                <div class="row">

				                    <div class="col-md-6 mb-3">

				                        <label>

				                            Project Thumbnail

				                        </label>

				                        <input

				                                type="file"

				                                class="form-control"

				                                name="thumbnailFile"

				                                accept="image/*">

				                    </div>

				                    <div class="col-md-6 mb-3">

				                        <label>

				                            Demo Video

				                        </label>

				                        <input

				                                type="file"

				                                class="form-control"

				                                name="demoVideoFile"

				                                accept="video/*">

				                    </div>

				                </div>

				                <div class="mb-3">

				                    <label>

				                        Gallery Images

				                    </label>

				                    <input

				                            type="file"

				                            class="form-control"

				                            name="galleryImages"

				                            multiple

				                            accept="image/*">

				                </div>

				                <!-- ========================= -->
				                <!-- Project Settings -->
				                <!-- ========================= -->

				                <div class="row">

				                    <div class="col-md-4 mb-3">

				                        <label>

				                            Display Order

				                        </label>

				                        <input

				                                type="number"

				                                class="form-control"

				                                th:field="*{displayOrder}"

				                                value="0">

				                    </div>

				                    <div class="col-md-4 mb-3">

				                        <label>

				                            Project Status

				                        </label>

				                        <select

				                                class="form-select"

				                                th:field="*{projectStatus}">

				                            <option value="Draft">

				                                Draft

				                            </option>

				                            <option value="Published">

				                                Published

				                            </option>

				                            <option value="Coming Soon">

				                                Coming Soon

				                            </option>

				                        </select>

				                    </div>

				                    <div class="col-md-4 mb-3 d-flex align-items-center">

				                        <div class="form-check mt-4">

				                            <input

				                                    class="form-check-input"

				                                    type="checkbox"

				                                    th:field="*{featured}">

				                            <label class="form-check-label">

				                                Featured Project

				                            </label>

				                        </div>

				                    </div>

				                </div>

				                <div class="mb-3">

				                    <div class="form-check">

				                        <input

				                                class="form-check-input"

				                                type="checkbox"

				                                th:field="*{published}">

				                        <label class="form-check-label">

				                            Publish Immediately

				                        </label>

				                    </div>

				                </div>

				                <!-- ========================= -->
				                <!-- SEO -->
				                <!-- ========================= -->

				                <div class="mb-3">

				                    <label>

				                        SEO Title

				                    </label>

				                    <input

				                            type="text"

				                            class="form-control"

				                            th:field="*{seoTitle}">

				                </div>

				                <div class="mb-4">

				                    <label>

				                        SEO Description

				                    </label>

				                    <textarea

				                            rows="3"

				                            class="form-control"

				                            th:field="*{seoDescription}">

				                    </textarea>

				                </div>

				                <!-- ========================= -->
				                <!-- Buttons -->
				                <!-- ========================= -->

				                <div class="text-end">

				                    <button

				                            type="reset"

				                            class="btn btn-secondary">

				                        <i class="bi bi-arrow-clockwise"></i>

				                        Reset

				                    </button>

				                    <button

				                            type="submit"

				                            class="btn btn-success">

				                        <i class="bi bi-check-circle-fill"></i>

				                        Save Project

				                    </button>

				                </div>

				            </form>

				        </div>

				    </div>

				</div>

				<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

				</body>

				</html>
