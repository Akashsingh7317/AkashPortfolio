<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Project Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Project Management

        </h2>

        <a th:href="@{/admin/projects/add}"

           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            Add Project

        </a>

    </div>

    <!-- Search -->

    <form th:action="@{/admin/projects/search}"

          method="get"

          class="row mb-4">

        <div class="col-md-10">

            <input type="text"

                   class="form-control"

                   placeholder="Search Project..."

                   name="keyword">

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">

                <i class="bi bi-search"></i>

                Search

            </button>

        </div>

    </form>

    <!-- Project Table -->

    <div class="table-responsive">

        <table class="table table-dark table-hover align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Image</th>

                <th>Project</th>

                <th>Category</th>

                <th>Status</th>

                <th>Featured</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="project : ${projects}">

                <td th:text="${project.id}"></td>

                <td>

                    <img th:src="@{'/uploads/' + ${project.thumbnail}}"

                         width="80"

                         class="rounded">

                </td>

                <td>

                    <strong th:text="${project.title}"></strong>

                    <br>

                    <small th:text="${project.technologies}"></small>

                </td>

                <td th:text="${project.category}"></td>

                <td>

                    <span class="badge bg-success"

                          th:if="${project.published}">

                        Published

                    </span>

                    <span class="badge bg-warning"

                          th:unless="${project.published}">

                        Draft

                    </span>

                </td>

                <td>

                    <span class="badge bg-primary"

                          th:if="${project.featured}">

                        Featured

                    </span>

                    <span class="badge bg-secondary"

                          th:unless="${project.featured}">

                        No

                    </span>

                </td>

                <td>
					
					                    <a th:href="@{'/admin/projects/view/' + ${project.id}}"
					                       class="btn btn-sm btn-info">

					                        <i class="bi bi-eye-fill"></i>

					                    </a>

					                    <a th:href="@{'/admin/projects/edit/' + ${project.id}}"
					                       class="btn btn-sm btn-warning">

					                        <i class="bi bi-pencil-square"></i>

					                    </a>

					                    <a th:href="@{'/admin/projects/delete/' + ${project.id}}"
					                       class="btn btn-sm btn-danger"

					                       onclick="return confirm('Delete this project?')">

					                        <i class="bi bi-trash-fill"></i>

					                    </a>

					                    <a th:if="${project.published}"

					                       th:href="@{'/admin/projects/unpublish/' + ${project.id}}"

					                       class="btn btn-sm btn-secondary">

					                        Unpublish

					                    </a>

					                    <a th:unless="${project.published}"

					                       th:href="@{'/admin/projects/publish/' + ${project.id}}"

					                       class="btn btn-sm btn-success">

					                        Publish

					                    </a>

					                    <a th:if="${project.featured}"

					                       th:href="@{'/admin/projects/remove-feature/' + ${project.id}}"

					                       class="btn btn-sm btn-dark">

					                        Remove Feature

					                    </a>

					                    <a th:unless="${project.featured}"

					                       th:href="@{'/admin/projects/feature/' + ${project.id}}"

					                       class="btn btn-sm btn-primary">

					                        Feature

					                    </a>

					                </td>

					            </tr>

					            </tbody>

					        </table>

					    </div>

					    <!-- =============================== -->
					    <!-- Success Messages -->
					    <!-- =============================== -->

					    <div th:if="${param.success}"

					         class="alert alert-success mt-3">

					        Project saved successfully.

					    </div>

					    <div th:if="${param.updated}"

					         class="alert alert-primary mt-3">

					        Project updated successfully.

					    </div>

					    <div th:if="${param.deleted}"

					         class="alert alert-danger mt-3">

					        Project deleted successfully.

					    </div>

					    <!-- =============================== -->
					    <!-- Pagination -->
					    <!-- =============================== -->

					    <nav class="mt-4">

					        <ul class="pagination justify-content-center">

					            <li class="page-item"

					                th:each="i : ${#numbers.sequence(1,totalPages)}">

					                <a class="page-link"

					                   th:text="${i}"

					                   th:href="@{'/admin/projects/page/' + ${i}}">

					                </a>

					            </li>

					        </ul>

					    </nav>

					</div>

					<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

					</body>

					</html>
