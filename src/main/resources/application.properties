spring.application.name=AkashPortfolio

server.port=${PORT:9090}


spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ==========================
# JPA
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# THYMELEAF
# ==========================

spring.thymeleaf.cache=false

# ==========================
# FILE UPLOAD
# ==========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload-dir=uploads

# ==========================
# MAIL
# ==========================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:akashsingh16423@gmail.com}
# Gmail App Password — set the MAIL_PASSWORD environment variable, never commit it
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# LOGGING
# ==========================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

